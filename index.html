<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<style>
:root{--bg:#121214;--card:#1b1b1f;--tx:#ececee;--mu:#8a8a93;--ac:#8fb4ff;--ac2:rgba(143,180,255,.12);--bd:#2a2a30;--pos:#7ddba5;--neg:#f08a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:600;margin:4px 0 16px;letter-spacing:-.01em}
h2{font-size:12px;font-weight:600;margin:20px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.card,.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stats .stat{margin:0}
.stat b{display:block;font-size:24px;font-weight:600;letter-spacing:-.01em}
.stat b.pos{color:var(--pos)}.stat b.neg{color:var(--neg)}
.stat span{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus,select:focus{outline:0;border-color:var(--ac)}
input[type=date],input[type=time],input[type=month]{color-scheme:dark}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;background:var(--ac);color:#0d1424;cursor:pointer;width:100%}
button:active{opacity:.85}
button.g{background:var(--ac2);color:var(--ac);width:auto;padding:6px 10px;font-size:13px}
button.x{background:transparent;color:var(--mu);width:auto;padding:4px 8px;font-size:18px}
button.x:active{color:var(--neg)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item .m{flex:1;min-width:0}
.item .m small{display:block;color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.pos{color:var(--pos);font-weight:600}
.neg{color:var(--neg);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{background:transparent;color:var(--mu);flex:1;padding:8px 2px;font-size:12px;border-radius:10px}
nav button span{display:block;font-size:20px;filter:grayscale(1)}
nav button.on{color:var(--ac);background:var(--ac2)}
nav button.on span{filter:none}
.empty{color:var(--mu);text-align:center;padding:14px}
#st{font-size:12px;font-weight:400;color:var(--mu);float:right;margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-size:14px}
.chk input{width:auto;accent-color:#8fb4ff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal i{font-style:normal;text-align:center;font-size:11px;color:var(--mu)}
.cd{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg);border:1px solid var(--bd);cursor:pointer}
.cd.of{color:var(--mu);background:transparent;border-style:dashed}
.cd.no{color:var(--mu);opacity:.55}
.cd.ot{border-color:var(--ac);color:var(--ac)}
.cd.xd{border-color:var(--pos);color:var(--pos);background:rgba(125,219,165,.1)}
.cd.ab{border-color:var(--neg);color:var(--neg)}
.cd.tdy{outline:2px solid var(--tx);outline-offset:1px}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:12;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 8px 8px 14px;align-items:center;gap:10px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
</style>
</head>
<body>
<main>
  <h1>My dashboard <span id="st"></span></h1>
  <div id="v"></div>
</main>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
const TABS=[["work","🕒","Work"],["cal","📅","Calendar"],["bank","⏳","Bank"],["money","💶","Money"],["games","🎮","Games"]];
const CATS=["Salary","Other income","Housing","Food","Transport","Bills","Fun","Health","Games","Other"];
const STAT=["Backlog","Playing","Finished","Dropped"];
const PRI=["Low","Medium","High","Must play"];
const gSort=(a,b)=>PRI.indexOf(b.pri||"Medium")-PRI.indexOf(a.pri||"Medium")||a.title.localeCompare(b.title);
const gameInfo=g=>[g.platform,g.genre,g.rel&&g.rel.slice(0,4),g.est&&"~"+hm(g.est)+" h",(g.pri&&g.pri!=="Medium")&&g.pri,g.rate&&"\u2605 "+g.rate,g.price&&fmtM(g.price)].filter(Boolean).map(esc).join(" \u00b7 ");
let S={settings:{target:8,cur:"€"},work:[],bank:[],days:[],money:[],games:[],budgets:{},recur:[]};
/* 4-week rotation (Mon–Sun weeks). getDay: Sun=0 Tue=2 Wed=3 Sat=6 */
const OFF=[[2,0],[6,0],[3,0],[6,0]];
const mondayStr=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};
function weekNo(ds){const a=new Date((S.settings.anchor||"2026-11-16")+"T12:00:00"),b=new Date(mondayStr(new Date(ds+"T12:00:00"))+"T12:00:00");return((Math.round((b-a)/604800000)%4)+4)%4}
const isOff=ds=>OFF[weekNo(ds)].includes(new Date(ds+"T12:00:00").getDay());
function hintText(ds){return "Week "+(weekNo(ds)+1)+" · "+(isOff(ds)?"scheduled day off, counts as a paid extra day":"working day")}
let tab="work",ref=null,timer=null,mon=new Date().toISOString().slice(0,7);

const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ld=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ld(new Date());
const addDays=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return ld(d)};
const lastDay=()=>{const n=new Date();if(n.getHours()<17)n.setDate(n.getDate()-1);return ld(n)};
const uid=()=>Math.random().toString(36).slice(2,9);
const hm=h=>{const t=Math.round(Math.abs(h)*60);return (h<0&&t>0?"\u2212":"")+Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
const fmtH=h=>hm(h)+" h";
function parseH(v){v=String(v||"").trim().replace(",",".");if(!v)return NaN;const neg=/^[-\u2212]/.test(v);v=v.replace(/^[-+\u2212]/,"");let r;if(v.includes(":")){const p=v.split(":");if(!/^\d*$/.test(p[0])||!/^\d{1,2}$/.test(p[1]||"0")||+p[1]>59)return NaN;r=(+p[0]||0)+(+p[1]||0)/60}else{r=Number(v)}if(isNaN(r))return NaN;return neg?-r:r}
const fmtM=n=>(n<0?"−":"")+S.settings.cur+Math.abs(n).toFixed(2);
const toMin=t=>{if(!t)return null;const[a,b]=t.split(":").map(Number);return a*60+b};
function worked(e){const a=toMin(e.start),b=toMin(e.end);if(a==null||b==null)return 0;let m=b-a;if(m<0)m+=1440;return Math.max(0,(m-(+e.brk||0))/60)}
const extra=e=>worked(e)-(isOff(e.date)?0:S.settings.target);

/* ---------- storage: db (syncs across devices), localStorage fallback ---------- */
function init(){
  try{const raw=localStorage.getItem("dash");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
  let mig=false;if(!S.settings.anchor||S.settings.ver!==2){S.settings.anchor="2026-11-16";S.settings.ver=2;mig=true}
  if(!S.settings.from){S.settings.from=mondayStr(new Date())}
  norm();if(applyRecur()||mig)save();
  setSt("Stored on this device");
  render();
}
function setSt(t){$("#st").textContent=t}
function save(){
  render();
  try{localStorage.setItem("dash",JSON.stringify(S));setSt("Saved on this device")}catch(e){setSt("Could not save")}
}

/* ---------- helpers ---------- */
const openBal=()=>S.settings.open==null?10:+S.settings.open;
function bankBalance(){
  let h=openBal();
  S.work.forEach(e=>{if(isOff(e.date))return;if(e.bank&&extra(e)>0)h+=extra(e)});
  S.bank.forEach(b=>h+=+b.h);
  return h;
}
const extraHoursTotal=()=>S.work.filter(e=>!e.abs&&!isOff(e.date)&&extra(e)>0).reduce((a,e)=>a+extra(e),0);
const extraDays=p=>S.work.filter(e=>isOff(e.date)&&worked(e)>0&&e.date.startsWith(p)).length;
let undoData=null,tt=null;
function toast(msg,noUndo){const t=$("#toast");t.innerHTML=esc(msg)+(noUndo?"":' <button class="g" onclick="undo()">Undo</button>');t.style.display="flex";clearTimeout(tt);tt=setTimeout(()=>{t.style.display="none";undoData=null},6000)}
function del(list,id){const i=S[list].findIndex(x=>x.id===id);if(i<0)return;undoData={list,item:S[list][i],i};S[list].splice(i,1);save();toast("Deleted")}
window.undo=()=>{if(!undoData)return;const u=undoData;undoData=null;S[u.list].splice(u.i,0,u.item);save();toast("Restored",1)};
window.del=del;

let wEdit=null,mEdit=null,gEdit=null,cal=today().slice(0,7),yr=today().slice(0,4);
const setv=(id,v)=>{const e=$(id);if(e)e.value=v};
const btn=(id,t)=>{const b=$(id);if(b)b.textContent=t};
window.editWork=id=>{const e=S.work.find(x=>x.id===id);if(!e)return;tab="work";render();wEdit=id;
  setv("#wd",e.date);setv("#wt",e.abs?"abs":"hours");setv("#ws",e.start||"08:00");setv("#we",e.end||"17:00");setv("#wb",e.brk==null?60:e.brk);setv("#wn",e.note||"");
  const k=$("#wk");if(k)k.checked=e.bank!==false;wtype();hint();btn("#wsave","Update exception");$("#wd").scrollIntoView({block:"center"})};
window.editMoney=id=>{const x=S.money.find(m=>m.id===id);if(!x)return;tab="money";render();mEdit=id;
  setv("#mt",x.type);setv("#ma",x.amt);setv("#md",x.date);setv("#mc",x.cat);setv("#mn",x.note||"");btn("#msave","Update entry");$("#ma").scrollIntoView({block:"center"})};
window.editGame=id=>{const g=S.games.find(m=>m.id===id);if(!g)return;tab="games";render();gEdit=id;
  setv("#gt",g.title);setv("#gp",g.platform||"");setv("#gs",g.status);setv("#gpr",g.price||"");setv("#gg",g.genre||"");setv("#gr",g.rel||"");setv("#ge",g.est?hm(g.est):"");setv("#gq",g.pri||"Medium");setv("#gk",g.rate||"");btn("#gsave","Update game");$("#gt").scrollIntoView({block:"center"})};
function calCls(ds){const r=dayRec(ds),off=isOff(ds);
  if(r.k==="abs")return"ab";
  if(r.k==="log")return off?"xd":(extra(r.e)>0?"ot":"nm");
  if(r.k==="auto")return"nm";
  return off?"of":"no"}
function vCal(){
  const[y,m]=cal.split("-").map(Number),lead=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate();
  let c="MTWTFSS".split("").map(l=>`<i>${l}</i>`).join("")+"<div></div>".repeat(lead);
  for(let d=1;d<=dim;d++){const ds=cal+"-"+String(d).padStart(2,"0");c+=`<div class="cd ${calCls(ds)}${ds===today()?" tdy":""}" onclick="pickDay('${ds}')">${d}</div>`}
  const name=new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  return `<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="g" onclick="calGo(-1)">\u2039</button><b style="flex:1;text-align:center">${name}</b><button class="g" onclick="calGo(1)">\u203a</button></div><div class="cal">${c}</div>
  <p style="color:var(--mu);font-size:12px;margin:10px 0 0">Blue: overtime \u00b7 Green: extra day \u00b7 Red: not worked \u00b7 Dashed: day off. Tap a day to log or edit it.</p></div>`;
}
function vCalTab(){

/* A day is automatic (normal shift) unless an exception was logged for that date */
function dayRec(ds){
  const e=S.work.find(x=>x.date===ds);
  if(e)return e.abs?{h:0,k:"abs",e}:{h:worked(e),k:"log",e};
  const from=S.settings.from||"9999-12-31";
  if(ds<from||ds>lastDay())return{h:0,k:"none"};
  return isOff(ds)?{h:0,k:"off"}:{h:S.settings.target,k:"auto"};
}
function hoursRange(a,b){let h=0;for(let d=a,i=0;d<=b&&i<400;d=addDays(d,1),i++)h+=dayRec(d).h;return h}
function dayRow(ds){
  const r=dayRec(ds),e=r.e;
  const wd=new Date(ds+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short"});
  let sub,val,del="";
  if(r.k==="log"){
    const x=extra(e);
    sub=esc(e.start)+"\u2013"+esc(e.end)+" \u00b7 "+fmtH(r.h)+(e.note?" \u00b7 "+esc(e.note):"");
    val=isOff(ds)?'<span class="pos">Extra day</span>':`<span class="${x>0?"pos":x<0?"neg":""}">${x>0?"+":""}${fmtH(x)}</span>`;
    del=`<button class="x" onclick="del('work','${e.id}')">\u00d7</button>`;
  }else if(r.k==="abs"){
    sub="Not worked"+(e.note?" \u00b7 "+esc(e.note):"");val='<span style="color:var(--mu)">\u2014</span>';
    del=`<button class="x" onclick="del('work','${e.id}')">\u00d7</button>`;
  }else if(r.k==="off"){sub="Day off";val='<span style="color:var(--mu)">off</span>'}
  else if(r.k==="auto"){sub="Normal day \u00b7 "+fmtH(r.h);val='<span style="color:var(--mu)">auto</span>'}
  else if(ds===today()){sub=isOff(ds)?"Day off":"Working day \u00b7 counts after 17:00";val='<span style="color:var(--mu)">today</span>'}
  else return"";
  return `<div class="item"><div class="m"${e?` onclick="editWork('${e.id}')" style="cursor:pointer"`:""}><b>${wd} ${esc(ds)}</b><small>${sub}</small></div>${val}${del}</div>`;
}

function strip(){const m=new Date(mondayStr(new Date())+"T12:00:00");let s="";for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);const ds=d.toISOString().slice(0,10);const o=isOff(ds);s+=`<div style="flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:13px;${o?"background:var(--ac2);color:var(--ac);font-weight:600":""}${ds===today()?";outline:2px solid var(--ac)":""}">${"MTWTFSS"[i]}<br>${o?"Off":"Work"}</div>`}return s}

async function saveFile(name,data,type){
  try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return true}}catch(e){if(e&&e.code==="declined")return false}
  const b=new Blob([data],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}

const csvq=v=>{v=String(v==null?"":v);return/[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function csvRows(k){
  if(k==="work"){const rows=[["date","status","hours_worked","extra_hours","note"]];
    const a=[...S.work.map(e=>e.date),S.settings.from||"9999"].sort()[0],z=[lastDay(),...S.work.map(e=>e.date)].sort().pop();
    for(let d=a,i=0;d<=z&&i<4000;d=addDays(d,1),i++){const r=dayRec(d);if(r.k==="none")continue;

      const ex=r.k==="log"&&!isOff(d)?extra(r.e):0;

  if(k==="bank"){return[["date","hours","note"],...[...S.bank.map(b=>[b.date,Math.round(+b.h*100)/100,b.note||"Manual entry"]),...S.work.filter(e=>!e.abs&&!isOff(e.date)&&e.bank&&extra(e)>0).map(e=>[e.date,Math.round(extra(e)*100)/100,"Overtime from work log"])].sort((a,b)=>a[0].localeCompare(b[0]))]}
  if(k==="money"){return[["date","type","amount","category","note"],...[...S.money].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.type==="in"?"income":"expense",x.amt,x.cat,x.note||""])]}

  <button class="p" id="msave" onclick="addMoney()">Save</button></div>
  ${cats.length?`<h2>Spending by category</h2><div class="card">${cats.map(([c,v])=>`<div class="item"><div class="m">${esc(c)}</div><span>${fmtM(v)}</span></div>`).join("")}</div>`:""}
  <h2>Entries</h2><div class="card">${list.length?list.map(x=>`<div class="item"><div class="m" onclick="editMoney('${x.id}')" style="cursor:pointer"><b>${esc(x.cat)}</b><small>${esc(x.date)}${x.note?" · "+esc(x.note):""}</small></div><span class="${x.type==="in"?"pos":"neg"}">${x.type==="in"?"+":"−"}${fmtM(+x.amt)}</span><button class="x" onclick="del('money','${x.id}')">×</button></div>`).join(""):'<div class="empty">Nothing this month</div>'}</div>
  ${moneyExtras(by)}`;
}
window.addMoney=()=>{const amt=+$("#ma").value;if(!amt||!$("#md").value)return;S.money=S.money.filter(x=>x.id!==mEdit);mEdit=null;S.money.push({id:uid(),type:$("#mt").value,amt:Math.abs(amt),date:$("#md").value,cat:$("#mc").value,note:$("#mn").value.trim()});save()};

function vGames(){
  const cnt=s=>S.games.filter(g=>g.status===s).length;
  return `<div class="stats"><div class="stat"><b>${cnt("Backlog")}</b><span>In backlog</span></div><div class="stat"><b>${cnt("Finished")}</b><span>Finished</span></div></div>
  <div class="card"><h2 style="margin-top:0">Add a game</h2>
  <label>Title</label><input id="gt"><div style="height:8px"></div>
  <div class="row"><div><label>Platform</label><input id="gp" placeholder="PC, PS5…"></div><div><label>Status</label><select id="gs">${STAT.map(s=>`<option>${s}</option>`).join("")}</select></div></div>
  <div class="row"><div><label>Genre</label><input id="gg" placeholder="RPG, Action…"></div><div><label>Release date</label><input type="date" id="gr"></div></div>
  <div class="row"><div><label>Est. hours</label><input id="ge" placeholder="e.g. 40 or 12:30"></div><div><label>Priority</label><select id="gq">${PRI.slice().reverse().map(p=>`<option${p==="Medium"?" selected":""}>${p}</option>`).join("")}</select></div></div>
  <div class="row"><div><label>Rating (1–10)</label><input id="gk" type="number" min="1" max="10" step="0.5" inputmode="decimal"></div><div><label>Price (${S.settings.cur}, optional)</label><input id="gpr" type="number" step="0.01" inputmode="decimal" placeholder="Adds an expense"></div></div>
  <button class="p" id="gsave" onclick="addGame()">Add</button></div>
  ${STAT.map(s=>{const l=S.games.filter(g=>g.status===s).sort(gSort);if(!l.length)return"";return `<h2>${s} (${l.length})</h2><div class="card">${l.map(g=>`<div class="item"><div class="m" onclick="editGame('${g.id}')" style="cursor:pointer"><b>${esc(g.title)}</b><small>${gameInfo(g)}</small></div><select style="width:auto" onchange="setGame('${g.id}',this.value)">${STAT.map(o=>`<option${o===g.status?" selected":""}>${o}</option>`).join("")}</select><button class="x" onclick="del('games','${g.id}')">×</button></div>`).join("")}</div>`}).join("")}
  ${S.games.length?"":'<div class="empty">Your backlog is empty</div>'}`;
}
window.addGame=()=>{const t=$("#gt").value.trim();if(!t)return;
  const old=S.games.find(x=>x.id===gEdit)||{},id=gEdit||uid(),price=Math.abs(parseFloat(String($("#gpr").value).replace(",","."))||0),prev=+old.price||0;
  const est=parseH($("#ge").value),rate=parseFloat(String($("#gk").value).replace(",","."))||0,status=$("#gs").value;
  const g={...old,id,title:t,platform:$("#gp").value.trim(),status,price,genre:$("#gg").value.trim(),rel:$("#gr").value,est:est>0?est:0,pri:$("#gq").value,rate:rate>0?Math.min(10,rate):0};
  if(status==="Finished"){if(!g.done)g.done=today()}else delete g.done;
  S.games=S.games.filter(x=>x.id!==gEdit);gEdit=null;S.games.push(g);
  if(price!==prev){const ex=S.money.find(x=>x.gid===id);
    if(price>0){if(ex){ex.amt=price;ex.note=t}else S.money.push({id:uid(),type:"out",amt:price,date:today(),cat:"Games",note:t,gid:id})}
    else if(ex)S.money=S.money.filter(x=>x!==ex)}
  save()};
window.setGame=(id,s)=>{const g=S.games.find(x=>x.id===id);if(g){g.status=s;if(s==="Finished"){if(!g.done)g.done=today()}else delete g.done;save()}};

function render(){
  wEdit=mEdit=gEdit=null;
  const y=window.scrollY;
  $("#v").innerHTML={work:vWork,cal:vCalTab,bank:vBank,money:vMoney,games:vGames}[tab]();
  $("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
  window.scrollTo(0,y);
}
window.go=t=>{tab=t;render();window.scrollTo(0,0);try{if(location.hash!=="#"+t)history.replaceState(null,"","#"+t)}catch(e){}};
const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;
init();
</script>
</body>
</html>
